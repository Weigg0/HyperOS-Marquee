name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platforms;android-35 build-tools;35.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: |
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | grep -iE "error|FAILED|Exception|failure|e:" | head -30

    - name: Full Build Log on Failure
      if: failure()
      run: |
        echo "=== FULL BUILD OUTPUT ==="
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: HyperOS-Marquee-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
